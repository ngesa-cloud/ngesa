<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#04060a">
  <title>NGESA // Carl Johnson (CJ) &mdash; San Andreas Stride</title>
  <meta name="description" content="Infinite 3D runner simulation of Carl Johnson (CJ) running infinitely with MAX stamina in his iconic white tank and blue jeans.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=cj_live_v2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2322c55e%22/><text y=%2266%22 x=%2250%22 font-size=%2244%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23000%22>CJ</text></svg>">
  
  <!-- Automatic Cache Purge Script -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
    }
  </script>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- WebGL 3D Simulation Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Minimalist HUD Overlay -->
  <main class="hud">
    
    <!-- Top Minimalist Bar: Brand & Telemetry -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">NGESA</span>
        <span class="brand-sub">CARL JOHNSON &bull; GROVE STREET STRIDE</span>
      </div>

      <!-- Minimalist Inline Telemetry Stream -->
      <div class="telemetry">
        <div class="stat">
          <span class="stat-label">DIST</span>
          <span class="stat-val highlight" id="metricDistance">0.000 <small>KM</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">SPEED</span>
          <span class="stat-val" id="metricSpeed">21.2 <small>KM/H</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">STAMINA</span>
          <span class="stat-val stamina-max" id="metricStamina">MAX 100%</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">RESPECT</span>
          <span class="stat-val respect-stat" id="metricRespect">+ GROVE</span>
        </div>
      </div>

      <!-- Sound Toggle -->
      <div class="top-controls">
        <button class="sound-pill" id="audioToggleBtn" type="button" aria-label="Toggle Sound Effects">
          <span id="audioIcon">🔇</span>
          <span id="audioText">MUTE</span>
        </button>
      </div>
    </header>

    <!-- Center Floating Minimalist Quotation -->
    <div class="quote-area">
      <p class="quote-text" id="quoteText">&ldquo;Ah shit, here we go again.&rdquo;</p>
      <span class="quote-author">&mdash; Carl Johnson (CJ)</span>
    </div>

    <!-- Bottom Minimalist Controls Dock -->
    <footer class="bottom-dock">
      <!-- Runner Selector -->
      <div class="control-group">
        <span class="group-label">RUNNER</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-runner="cj" onclick="setRunner('cj')">CJ</button>
          <button class="pill-btn" data-runner="kipchoge" onclick="setRunner('kipchoge')">Kipchoge</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <!-- Camera Angles (Default Front View) -->
      <div class="control-group">
        <span class="group-label">CAMERA</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-cam="broadcast" onclick="setCameraMode('broadcast')">Front (Face)</button>
          <button class="pill-btn" data-cam="chase" onclick="setCameraMode('chase')">Behind</button>
          <button class="pill-btn" data-cam="profile" onclick="setCameraMode('profile')">Profile</button>
          <button class="pill-btn" data-cam="closeup" onclick="setCameraMode('closeup')">Focus</button>
          <button class="pill-btn" data-cam="cinematic" onclick="setCameraMode('cinematic')">Orbit</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <!-- Speed Gears -->
      <div class="control-group">
        <span class="group-label">SPEED</span>
        <div class="pill-buttons">
          <button class="pill-btn" data-pace="jog" onclick="setPacingMode('jog')">Jog</button>
          <button class="pill-btn active" data-pace="sprint" onclick="setPacingMode('sprint')">Sprint</button>
          <button class="pill-btn" data-pace="infinite" onclick="setPacingMode('infinite')">Super</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <!-- Minimalist San Andreas Palettes -->
      <div class="control-group">
        <span class="group-label">THEME</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-theme="grove" onclick="setTheme('grove')">Grove St</button>
          <button class="pill-btn" data-theme="fierro" onclick="setTheme('fierro')">San Fierro</button>
          <button class="pill-btn" data-theme="vinewood" onclick="setTheme('vinewood')">Vinewood</button>
        </div>
      </div>
    </footer>

  </main>

  <script src="app.js?v=cj_live_v2"></script>
</body>
</html>
