<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070d">
  <title>NGESA // The Immortal Stride &mdash; Kipchoge Solo Simulation</title>
  <meta name="description" content="A minimalist, infinite 3D marathon simulation of the immortal Kipchoge clone running solo against infinity. Sub-2 hour pacing, procedural kinematics, and pure minimalist design.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2300ff66%22/><text y=%2266%22 x=%2250%22 font-size=%2244%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23000%22>1:59</text></svg>">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- WebGL 3D Simulation Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Minimalist HUD Overlay -->
  <main class="hud">
    
    <!-- Top Minimalist Bar: Brand & Telemetry -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">NGESA</span>
        <span class="brand-sub">THE IMMORTAL STRIDE &bull; 1:59</span>
      </div>

      <!-- Minimalist Inline Telemetry Stream -->
      <div class="telemetry">
        <div class="stat">
          <span class="stat-label">DIST</span>
          <span class="stat-val highlight" id="metricDistance">0.000 <small>KM</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">PACE</span>
          <span class="stat-val" id="metricPace">2:50 <small>/KM</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">CADENCE</span>
          <span class="stat-val" id="metricCadence">188 <small>SPM</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">HEART</span>
          <span class="stat-val pulse" id="metricHeartRate">168 <small>BPM</small></span>
        </div>
      </div>

      <!-- Sound Toggle -->
      <div class="top-controls">
        <button class="sound-pill" id="audioToggleBtn" type="button" aria-label="Toggle Metronome Sound">
          <span id="audioIcon">🔇</span>
          <span id="audioText">MUTE</span>
        </button>
      </div>
    </header>

    <!-- Center Floating Minimalist Quotation -->
    <div class="quote-area">
      <p class="quote-text" id="quoteText">&ldquo;No Human Is Limited.&rdquo;</p>
      <span class="quote-author">&mdash; Eliud Kipchoge</span>
    </div>

    <!-- Bottom Minimalist Controls Dock -->
    <footer class="bottom-dock">
      <div class="control-group">
        <span class="group-label">CAMERA</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-cam="chase" onclick="setCameraMode('chase')">Chase</button>
          <button class="pill-btn" data-cam="broadcast" onclick="setCameraMode('broadcast')">Front</button>
          <button class="pill-btn" data-cam="profile" onclick="setCameraMode('profile')">Profile</button>
          <button class="pill-btn" data-cam="closeup" onclick="setCameraMode('closeup')">Focus</button>
          <button class="pill-btn" data-cam="cinematic" onclick="setCameraMode('cinematic')">Orbit</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="control-group">
        <span class="group-label">PACE</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-pace="sub2" onclick="setPacingMode('sub2')">2:50</button>
          <button class="pill-btn" data-pace="berlin" onclick="setPacingMode('berlin')">2:52</button>
          <button class="pill-btn" data-pace="hypersonic" onclick="setPacingMode('hypersonic')">1:30</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <div class="control-group">
        <span class="group-label">THEME</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-biome="vienna" onclick="setBiome('vienna')">Obsidian</button>
          <button class="pill-btn" data-biome="cyber" onclick="setBiome('cyber')">Monochrome</button>
          <button class="pill-btn" data-biome="kaptagat" onclick="setBiome('kaptagat')">Dawn</button>
        </div>
      </div>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
