<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#04060a">
  <title>NGESA // Rolling Ball With A Head</title>
  <meta name="description" content="A minimalist, infinite 3D simulation of an immortal rolling ball with Carl Johnson's head perched on top, rolling endlessly down the road.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=ball_v1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%2322c55e%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22white%22/><text y=%2258%22 x=%2250%22 font-size=%2224%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22black%22>8</text></svg>">
  
  <!-- Automatic Cache Purge Script -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
    }
  </script>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- WebGL 3D Simulation Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Minimalist HUD Overlay -->
  <main class="hud">
    
    <!-- Top Minimalist Bar: Brand & Telemetry -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">NGESA</span>
        <span class="brand-sub">ROLLING BALL WITH A HEAD &bull; CJ EDITION</span>
      </div>

      <!-- Minimalist Inline Telemetry Stream -->
      <div class="telemetry">
        <div class="stat">
          <span class="stat-label">DIST</span>
          <span class="stat-val highlight" id="metricDistance">0.000 <small>KM</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">SPEED</span>
          <span class="stat-val" id="metricSpeed">21.2 <small>KM/H</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">ROLL</span>
          <span class="stat-val stamina-max" id="metricRpm">375 <small>RPM</small></span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-label">MODE</span>
          <span class="stat-val respect-stat" id="metricMode">BALL+HEAD</span>
        </div>
      </div>

      <!-- Sound Toggle -->
      <div class="top-controls">
        <button class="sound-pill" id="audioToggleBtn" type="button" aria-label="Toggle Sound Effects">
          <span id="audioIcon">🔇</span>
          <span id="audioText">MUTE</span>
        </button>
      </div>
    </header>

    <!-- Center Floating Minimalist Quotation -->
    <div class="quote-area">
      <p class="quote-text" id="quoteText">&ldquo;Ah shit, here we roll again.&rdquo;</p>
      <span class="quote-author">&mdash; Carl Johnson (CJ)</span>
    </div>

    <!-- Bottom Minimalist Controls Dock -->
    <footer class="bottom-dock">
      <!-- Head Selector -->
      <div class="control-group">
        <span class="group-label">HEAD</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-head="cj" onclick="setHead('cj')">CJ Head</button>
          <button class="pill-btn" data-head="kipchoge" onclick="setHead('kipchoge')">Kipchoge</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <!-- Ball Skin Selector -->
      <div class="control-group">
        <span class="group-label">BALL</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-ball="eightball" onclick="setBallSkin('eightball')">8-Ball</button>
          <button class="pill-btn" data-ball="cyber" onclick="setBallSkin('cyber')">Cyber Grid</button>
          <button class="pill-btn" data-ball="gold" onclick="setBallSkin('gold')">Gold Chrome</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <!-- Camera Angles -->
      <div class="control-group">
        <span class="group-label">CAMERA</span>
        <div class="pill-buttons">
          <button class="pill-btn active" data-cam="broadcast" onclick="setCameraMode('broadcast')">Front</button>
          <button class="pill-btn" data-cam="chase" onclick="setCameraMode('chase')">Behind</button>
          <button class="pill-btn" data-cam="profile" onclick="setCameraMode('profile')">Profile</button>
          <button class="pill-btn" data-cam="closeup" onclick="setCameraMode('closeup')">Focus</button>
          <button class="pill-btn" data-cam="cinematic" onclick="setCameraMode('cinematic')">Orbit</button>
        </div>
      </div>

      <div class="dock-sep"></div>

      <!-- Speed Gears -->
      <div class="control-group">
        <span class="group-label">SPEED</span>
        <div class="pill-buttons">
          <button class="pill-btn" data-pace="jog" onclick="setPacingMode('jog')">Roll</button>
          <button class="pill-btn active" data-pace="sprint" onclick="setPacingMode('sprint')">Fast</button>
          <button class="pill-btn" data-pace="infinite" onclick="setPacingMode('infinite')">Turbo</button>
        </div>
      </div>
    </footer>

  </main>

  <script src="app.js?v=ball_v1"></script>
</body>
</html>
